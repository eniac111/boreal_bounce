name: build
# The shared build. `ci.yml` calls it on every push and pull request and keeps the results as
# run artifacts; `release.yml` calls it when a release is published and then uploads the same
# files to that release. Nothing here publishes anything.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch or tag to build. Defaults to the commit that triggered the run.
        type: string
        default: ""
      version:
        description: Version stamped into the binaries and the AppStream data.
        type: string
        default: 0.0.0
      retention-days:
        description: How long to keep the run artifacts.
        type: number
        default: 14

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: true
      - name: Stamp the version
        run: python3 tools/set_version.py "${{ inputs.version }}"
      - name: Import project
        run: godot --headless --path . --import
      - name: Run tests
        run: ./tools/test.sh
      - name: Export every target
        run: |
          mkdir -p dist/web
          godot --headless --path . --export-release "Linux" dist/boreal_bounce.x86_64
          godot --headless --path . --export-release "Linux arm64" dist/boreal_bounce.arm64
          godot --headless --path . --export-release "Linux arm32" dist/boreal_bounce.arm32
          godot --headless --path . --export-release "Linux dedicated server" dist/boreal_bounce_server.x86_64
          godot --headless --path . --export-release "Linux dedicated server arm64" dist/boreal_bounce_server.arm64
          godot --headless --path . --export-release "Windows" dist/boreal_bounce.exe
          godot --headless --path . --export-release "Web" dist/web/index.html
      - name: Every desktop export must be one self-contained file
        run: |
          for f in dist/boreal_bounce.x86_64 dist/boreal_bounce.arm64 dist/boreal_bounce.arm32 \
                   dist/boreal_bounce_server.x86_64 dist/boreal_bounce_server.arm64 dist/boreal_bounce.exe; do
            test -s "$f" || { echo "::error::$f is missing or empty"; exit 1; }
            # a stray .pck means the preset lost binary_format/embed_pck and the build would
            # break as soon as the binary is renamed or installed on its own (the Flatpak does both)
            test ! -e "${f%.*}.pck" || { echo "::error::$f was exported with a separate .pck"; exit 1; }
          done
      - name: Package the downloads
        run: |
          v="${{ inputs.version }}"
          mkdir -p release
          install -m644 COPYING CREDITS.md dist/
          for arch in x86_64 arm64 arm32; do
            tar -C dist -czf "release/boreal-bounce-$v-linux-$arch.tar.gz" "boreal_bounce.$arch" COPYING CREDITS.md
          done
          for arch in x86_64 arm64; do
            tar -C dist -czf "release/boreal-bounce-$v-dedicated-server-$arch.tar.gz" "boreal_bounce_server.$arch" COPYING CREDITS.md
          done
          (cd dist && zip -q "../release/boreal-bounce-$v-windows-x86_64.zip" boreal_bounce.exe COPYING CREDITS.md)
          (cd dist/web && zip -qr "../../release/boreal-bounce-$v-web.zip" .)
      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: release/
          retention-days: ${{ inputs.retention-days }}
      - uses: actions/upload-artifact@v7
        with:
          name: linux-export-x86_64
          path: dist/boreal_bounce.x86_64
          retention-days: ${{ inputs.retention-days }}
      - uses: actions/upload-artifact@v7
        with:
          name: linux-export-aarch64
          path: dist/boreal_bounce.arm64
          retention-days: ${{ inputs.retention-days }}
      - name: Hand the stamped metadata to the Flatpak job
        uses: actions/upload-artifact@v7
        with:
          name: packaging-stamped
          path: packaging/
          retention-days: ${{ inputs.retention-days }}

  flatpak:
    needs: export
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      # that image is published for x86_64 only, so the ARM bundle is built under emulation
      # inside the privileged container, the way the action documents it
      - name: Install docker for the emulator setup
        if: matrix.arch != 'x86_64'
        run: dnf -y install docker
      - name: Set up QEMU
        if: matrix.arch != 'x86_64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: actions/download-artifact@v8
        with:
          name: linux-export-${{ matrix.arch }}
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: packaging-stamped
          path: packaging
      - name: Stage the build the manifest expects
        run: |
          for f in dist/boreal_bounce.*; do mv "$f" dist/boreal_bounce; done
          chmod +x dist/boreal_bounce
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: boreal-bounce-${{ inputs.version }}-${{ matrix.arch }}.flatpak
          manifest-path: packaging/flatpak/info.petrovs.BorealBounce.yml
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}
          upload-artifact: false
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-bundle-${{ matrix.arch }}
          path: boreal-bounce-${{ inputs.version }}-${{ matrix.arch }}.flatpak
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
